<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        div.container {
            background-color: aqua;
            display: flex;
        }

        div.item {
            background-color: rgb(130, 130, 177);
            border: 1px solid black;
            text-align: center;
            flex-flow: row nowrap;
            flex-basis: 250px;
            
            div#cxA {
                flex-shrink: 1;
                flex-grow: 0;
            }

            div#cxB {
                flex-shrink: 1;
                flex-grow: 1;
            }

            div#cxC {
                flex-shrink: 1;
                flex-grow: 0;
            }

        }
    </style>
</head>
<body>
   <div class="container">
<div class="item">A</div>
<div class="item">B</div>
<div class="item">C</div>

   </div> 
</body>
</html>
