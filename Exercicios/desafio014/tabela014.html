<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabela de Filmes</title>
<style>
  * {
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    background: #ffffff;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: flex-start;
    align-items: flex-start;
    min-height: 100vh;
  }

  .tabela-container {
    width: auto;
    overflow-x: auto;
  }

  table {
    border-collapse: collapse;
    font-size: 15px;
    color: #000;
    min-width: 500px;
  }

  th, td {
    border: 1px solid #7a7a7a;
    text-align: center;        /* centraliza tudo */
    vertical-align: middle;
    padding: 6px 10px;
    height: 32px;
  }

  /* Cabeçalho */
  thead th {
    background: #e6e6e6;
    font-weight: bold;
    text-align: center;        /* centraliza o cabeçalho */
  }

  /* Coluna Grupo (mesclada) */
  .grupo {
    background: #f2f2f2;
    font-weight: bold;
    vertical-align: middle;    /* centraliza verticalmente */
    text-align: center;        /* centraliza horizontalmente */
    white-space: nowrap;
  }

  /* Coluna Nomes */
  .nomes {
    white-space: nowrap;
  }

  /* Coluna Filmes */
  .filmes {
    white-space: nowrap;
  }

  /* ===== RESPONSIVIDADE ===== */
  @media (max-width: 600px) {
    body {
      padding: 10px;
    }

    table {
      font-size: 13px;
      min-width: 420px;
    }

    th, td {
      padding: 4px 6px;
      height: 28px;
    }
  }

  @media (max-width: 400px) {
    table {
      font-size: 11px;
      min-width: 340px;
    }

    th, td {
      padding: 3px 4px;
      height: 24px;
    }
  }
</style>
</head>
<body>

  <div class="tabela-container">
    <table>
      <thead>
        <tr>
          <th>Grupo</th>
          <th>Nomes</th>
          <th colspan="3">Filmes</th>
        </tr>
      </thead>
      <tbody>
        <!-- Mulheres - Linha 1 -->
        <tr>
          <td class="grupo" rowspan="3">Mulheres</td>
          <td class="nomes">Ana Maria Santos</td>
          <td class="filmes">Alien</td>
          <td class="filmes">Rambo</td>
          <td class="filmes">Vingadores</td>
        </tr>

        <!-- Mulheres - Linha 2 -->
        <tr>
          <td class="nomes">Beatriz Souza</td>
          <td class="filmes">Hulk</td>
          <td class="filmes">Inception</td>
          <td class="filmes">Batman</td>
        </tr>

        <!-- Mulheres - Linha 3 -->
        <tr>
          <td class="nomes">Cláudia Melo</td>
          <td class="filmes">Oblivion</td>
          <td class="filmes">Matrix</td>
          <td class="filmes">Big Hero</td>
        </tr>

        <!-- Homens - Linha 1 -->
        <tr>
          <td class="grupo" rowspan="3">Homens</td>
          <td class="nomes">Bruno Mendonça</td>
          <td class="filmes">Intocáveis</td>
          <td class="filmes">Amnésia</td>
          <td class="filmes">Gladiador</td>
        </tr>

        <!-- Homens - Linha 2 -->
        <tr>
          <td class="nomes">Daniel Lourenço</td>
          <td class="filmes">Wall-E</td>
          <td class="filmes">Old</td>
          <td class="filmes">Dangal</td>
        </tr>

        <!-- Homens - Linha 3 -->
        <tr>
          <td class="nomes">Fabiano Mota</td>
          <td class="filmes">Star Wars 5</td>
          <td class="filmes">Taxi Driver</td>
          <td class="filmes">Toy Story</td>
        </tr>
      </tbody>
    </table>
  </div>

</body>
</html>
