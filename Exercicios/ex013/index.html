<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inserindo video</title>
</head>
<body>
  <h1>Inserindo videos hospedados localmente</h1>
  <p>Este video esta hospedado no meu proprio servidor</p>
  <video width="300" controls autoplay loop>
    <source src="midia/natureza1.mp4" type="video/mp4">
    <source src="midia/natureza2.mp4" type="video/mp4">
    <source src="midia/natureza3.webm" type="video/webm">
    <p>Seu navegador não tem compatibilidade para abrir o video</p>
  </video>
  <h1>inserindo videos do youtube</h1> 
  <iframe width="560" height="315" src="https://www.youtube.com/embed/SM2LK5AMhyk?si=8BdV1k1Euawx1DI0&amp;start=44" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  
  
</body>
</html>
