<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'Love';
            src: url('Love Buble.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
            
        
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
           font-family: 'Love',times, serif;
           font-size: 3em;
           font-weight: normal;
        }

        p {
           font-family: 'Love',times, serif;
           font-size: 1em;
           font-weight: normal; 
        }
    </style>
</head>
<body>
    <h1>Eu sou o maximo</h1>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Animi officiis iure vel quasi amet dignissimos, cupiditate, dolores, repellendus facilis asperiores iusto omnis? Delectus ducimus saepe ad sapiente earum provident! Tenetur.</p>
</body>
</html>
