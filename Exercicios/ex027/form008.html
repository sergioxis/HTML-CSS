<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de Formulario</h1>
    <form action="cadastro.html" method="get" autocomplete="on">
        <p>
            <label for="in1">Numero 1</label>
            <input type="number" name="n1" id="in1" min="0" max="50" required oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value); isubtracao.innerHTML = Number(in1.value) + Number(in2.value) - Number(in3.value);">
        </p>

        <p>
            <label for="in2">Numero 2</label>
            <input type="number" name="n2" id="in2" min="0" max="50" required oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value); isubtracao.innerHTML = Number(in1.value) + Number(in2.value) - Number(in3.value);">
        </p>

        <p>
            <label for="in3">Numero 3</label>
            <!-- CORRIGIDO: id mudou para "in3" e atualiza o output correto -->
            <input type="number" name="n3" id="in3" min="0" max="50" required oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value); isubtracao.innerHTML = Number(in1.value) + Number(in2.value) - Number(in3.value);">
        </p>

        <p>
            <label for="isoma">Soma</label>
            <output name="soma" id="isoma">0</output>
        </p>

        <!-- ADICIONADO: Output para exibir o resultado da subtração -->
        <p>
            <label for="isubtracao">Resultado (Soma - Num 3)</label>
            <output name="subtracao" id="isubtracao">0</output>
        </p>

        <p>
            <label for="inum">Numero</label>
            <input type="range" name="num" id="inum" min="0" max="20" value="10" oninput="ival.innerHTML = Number(inum.value)">
            <output id="ival">10</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
