<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <h1>Teste de formulario</h1>
    <form action="cadastro.html" method="get" autocomplete="on">
    <p>
        <label for="iusu">Usuario</label>
        <input type="text" name="usu" id="iusu" required minlength="5" maxlength="15" size="12" placeholder="Nome do usuario" autocomplete="username">
    </p>

    <p>
       <label for="isen">Senha</label> 
       <input type="password" name="sen" id="isen" required minlength="8" size="10" placeholder="digite a senha" autocomplete="current-password">
    </p>

    <p>
        <input type="submit" name="" id="Enviar">
        <input type="reset" value="Limpar">
    </p>
    </form>
</body>
</html>
